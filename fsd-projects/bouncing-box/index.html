<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Bouncing Box</title>
    <script src="jquery.min.js"></script>
    <style>
        .box {
            width: 70px;
            height: 70px;
            background-color: teal;
            font-size: 300%;
            text-align: center;
            user-select: none;
            display: block;
            position: absolute;
            top: 100px;
            left: 0px;
        }

        .board {
            height: 100vh;
        }
    </style>
</head>

<body class="board">
    <!-- HTML for the box -->
    <div class="box">?</div>

    <script>
        (function () {
            "use strict";
            /* global jQuery */

            //////////////////////////////////////////////////////////////////
            ///////////////// SETUP DO NOT DELETE //////////////////////////
            //////////////////////////////////////////////////////////////////

            var box = jQuery(".box"); // reference to the HTML .box element
            var board = jQuery(".board"); // reference to the HTML .board element
            var boardWidth = board.width(); // the maximum X-Coordinate of the screen

            // update the boardWidth variable when the window is resized
            jQuery(window).on("resize", function () {
                boardWidth = board.width();
            });

            // moves the Box to a new position on the screen along the X-Axis
            function moveBoxTo(newPositionX) {
                box.css("left", newPositionX + "px");
            }

            // changes the text displayed on the Box
            function changeBoxText(newText) {
                box.text(newText);
            }

            //////////////////////////////////////////////////////////////////
            ///////////////// YOUR CODE BELOW HERE ///////////////////////////
            //////////////////////////////////////////////////////////////////

            // TODO 2 & 4 & 5 - Variable declarations
            var positionX = 0;
            var points = 0;
            var speed = 10;

            /**
             * This Function will be called 20 times/second.
             * Each time it is called, it should move the Box to a new location.
             * If the box drifts off the screen, turn it around!
             */
            function update() {
                /* TODO 2 & 5: Move the box using positionX and speed */
                positionX = positionX + speed;
                moveBoxTo(positionX);

                /* TODO 6: Bounce off the right boundary */
                if (positionX > boardWidth) {
                    speed = speed * -1;
                }
                /* TODO 7: Bounce off the left boundary */
                else if (positionX < 0) {
                    speed = speed * -1;
                }
            }

            /**
             * This Function will be called each time the box is clicked.
             * It should reset positionX, update the score, and recalculate speed.
             */
            function handleBoxClick() {
                /* TODO 3: Reset positionX */
                positionX = 0;

                /* TODO 4: Increase points */
                points = points + 1;

                /* TODO 4: Update text on the box */
                changeBoxText(points);

                /* TODO 8: Calculate speed using linear formula (3 * points + 10) */
                speed = 3 * points + 10;
            }

            setInterval(update, 50);

            // Every time the box is clicked, call the handleBoxClick Function
            box.on("click", handleBoxClick);
        })();
    </script>
</body>

</html>
