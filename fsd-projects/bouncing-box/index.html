<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bouncing Box</title>
    <script src="jquery.min.js"></script>
    <style>
      .box {
        width: 70px;
        height: 70px;
        background-color: teal;
        font-size: 300%;
        text-align: center;
        user-select: none;
        display: block;
        position: absolute;
        top: 100px;
        /* Change me! */
        left: 0px;
      }

      .board {
        height: 100vh;
      }
    </style>
    <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
  </head>

  <body class="board">
    <!-- HTML for the box -->
    <div class="box">?</div>

    <script>
      // Variable declarations
var positionX = 0;
var positionY = 0;      // Tracks vertical position for jumping
var speedY = 0;         // Vertical velocity
var gravity = 1.5;      // Pulls the box back down
var points = 0;
var speed = 10;
var isJumping = false;

// DOM elements
var collectible = jQuery(".collectible");
var platform = jQuery(".platform");

// Collectible item coordinates
var itemX = getRandomPosition(boardWidth - 30);
var itemY = 100;

// Platform box coordinates
var platformX = getRandomPosition(boardWidth - 100);
var platformWidth = 100;

// Initialize positions on load
moveItemTo(itemX, itemY);
movePlatformTo(platformX);

/*
 * Main game loop running 20 times per second
 */
function update() {
    // 1. Horizontal Movement
    positionX = positionX + speed;
    
    // 2. Vertical Jump Mechanics & Gravity
    positionY = positionY + speedY;
    if (positionY > 0) {
        speedY = speedY - gravity; // Apply gravity when off the ground
    } else {
        positionY = 0;
        speedY = 0;
        isJumping = false;
    }

    // 3. Platform Landing Detection
    // Check if box is falling onto the platform top surface
    if (positionX + 50 >= platformX && 
        positionX <= platformX + platformWidth && 
        positionY <= 20 && speedY <= 0) {
        positionY = 20; // Land on top of platform
        speedY = 0;
        isJumping = false;
    }

    // 4. Update Box Render Position
    moveBoxTo(positionX, positionY);

    // 5. Check for Grabbed Items
    checkItemCollision();

    // 6. Boundary Detection (Bouncing off walls)
    if (positionX > boardWidth - 50) {
        speed *= -1;
    }
    if (positionX < 0) {
        speed *= -1;
    }
}

/*
 * Handles Box Clicks & Spacebar Jump
 */
function handleBoxClick() {
    positionX = 0;
    points++;
    changeBoxText(points);
    
    // Linear speed formula (TODO 8 fix)
    speed = 3 * points + 10;
}

// Press Spacebar to Jump
jQuery(document).on('keydown', function(event) {
    if (event.keyCode === 32 && !isJumping) { // 32 = Spacebar
        speedY = 20; // Upward jump force
        isJumping = true;
    }
});

/*
 * Check if the box collides with the collectible item
 */
function checkItemCollision() {
    var horizontalMatch = Math.abs(positionX - itemX) < 40;
    var verticalMatch = Math.abs(positionY - itemY) < 40;

    if (horizontalMatch && verticalMatch) {
        points += 5; // Extra points for grabbing
        changeBoxText(points);
        
        // Respawn item and platform in new random locations
        itemX = getRandomPosition(boardWidth - 30);
        itemY = Math.floor(Math.random() * 150) + 50;
        moveItemTo(itemX, itemY);

        platformX = getRandomPosition(boardWidth - 100);
        movePlatformTo(platformX);
    }
}

/*
 * Helper Functions
 */
function getRandomPosition(max) {
    return Math.floor(Math.random() * max);
}

function moveItemTo(x, y) {
    collectible.css("left", x + "px");
    collectible.css("bottom", y + "px");
}

function movePlatformTo(x) {
    platform.css("left", x + "px");
}
      
     
    </script>
  </body>
</html>
